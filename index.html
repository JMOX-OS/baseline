<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baseline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #F5F0E8; color: #2a2420; -webkit-font-smoothing: antialiased; font-size: 16px; }
    #root { height: 100%; }
    button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #F5F0E8; }
    ::-webkit-scrollbar-thumb { background: #d9d0c0; border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function() {
  var h = React.createElement;

  var CATEGORIES = [
    { id: "connection",    label: "Connection",        description: "How emotional closeness and romantic attention show up in a relationship." },
    { id: "sex",           label: "Sex",               description: "The role of physical intimacy, frequency, and compatibility." },
    { id: "children",      label: "Children",          description: "Whether to have them, how many, and the role they play in a shared future." },
    { id: "family",        label: "Family",            description: "The place of extended family in daily life and major decisions." },
    { id: "religion",      label: "Religion",          description: "The role of faith, practice, and spiritual life in the relationship." },
    { id: "politics",      label: "Politics & Values", description: "Alignment or tolerance of difference on worldview, beliefs, and civic life." },
    { id: "financials",    label: "Financials",        description: "How money is earned, managed, and planned for." },
    { id: "home",          label: "Home & Daily Life", description: "Environment, habits, pace, and the texture of everyday living." },
    { id: "career",        label: "Career",            description: "The priority of professional ambition and how it shapes shared life." },
    { id: "location",      label: "Location",          description: "Where you live, and how fixed or flexible that is." },
    { id: "communication", label: "Communication",     description: "How needs, conflict, and difference get expressed and resolved." }
  ];

  var WEIGHTS = [
    { value: "essential", label: "Essential", bars: 3 },
    { value: "important", label: "Important", bars: 2 },
    { value: "flexible",  label: "Flexible",  bars: 1 }
  ];

  var ATTRIBUTIONS = [
    { value: "me",      label: "Me" },
    { value: "partner", label: "My Partner" },
    { value: "us",      label: "Us Together" }
  ];

  var C = {
    bg:       "#F5F0E8",
    surface:  "#FDFAF4",
    border1:  "#DDD6C8",
    border2:  "#EAE4D8",
    text:     "#2a2420",
    accent:   "#B85C38",
    accentBg: "#F7EDE7",
    dim1:     "#6a5f55",
    dim2:     "#9a8f85",
    dim3:     "#c4bab0"
  };

  function BarIcon(props) {
    var count = props.count, active = props.active;
    return h('div', { style: { display: "flex", gap: "3px", alignItems: "flex-end", height: "20px" } },
      [1,2,3].map(function(i) {
        return h('div', { key: i, style: {
          width: "4px",
          height: i === 1 ? "9px" : i === 2 ? "14px" : "20px",
          background: i <= count ? (active ? C.accent : C.dim2) : "transparent",
          border: "1.5px solid " + (i <= count ? (active ? C.accent : C.dim2) : C.border1),
          borderRadius: "1px",
          transition: "all 0.15s ease"
        }});
      })
    );
  }

  function CircleIcon(props) {
    var type = props.type, active = props.active;
    var col = active ? C.accent : C.dim2;
    if (type === "me") {
      return h('svg', { width: "20", height: "20", viewBox: "0 0 20 20" },
        h('circle', { cx: "10", cy: "10", r: "8", fill: col })
      );
    }
    if (type === "partner") {
      return h('svg', { width: "20", height: "20", viewBox: "0 0 20 20" },
        h('circle', { cx: "10", cy: "10", r: "7.5", fill: "none", stroke: col, strokeWidth: "2" })
      );
    }
    if (type === "us") {
      return h('svg', { width: "32", height: "20", viewBox: "0 0 32 20" },
        h('circle', { cx: "10", cy: "10", r: "7.5", fill: active ? C.accent : "none", fillOpacity: active ? "0.7" : "0", stroke: col, strokeWidth: "2" }),
        h('circle', { cx: "22", cy: "10", r: "7.5", fill: active ? C.accent : "none", fillOpacity: active ? "0.4" : "0", stroke: col, strokeWidth: "2" })
      );
    }
    return null;
  }

  function Selector(props) {
    var options = props.options, value = props.value, onChange = props.onChange, renderIcon = props.renderIcon;
    return h('div', { style: { display: "flex", gap: "6px" } },
      options.map(function(opt) {
        var active = value === opt.value;
        return h('button', {
          key: opt.value,
          onClick: function() { onChange(opt.value); },
          style: {
            display: "flex", flexDirection: "column", alignItems: "center", gap: "6px",
            padding: "10px 8px",
            background: active ? C.accentBg : C.bg,
            border: "1.5px solid " + (active ? C.accent : C.border1),
            borderRadius: "8px",
            cursor: "pointer",
            transition: "all 0.15s ease",
            flex: "1",
            minWidth: "0"
          }
        },
          renderIcon(opt, active),
          h('span', { style: {
            fontSize: "10px", letterSpacing: "0.07em",
            color: active ? C.accent : C.dim1,
            textTransform: "uppercase",
            fontFamily: "'DM Mono', monospace",
            whiteSpace: "nowrap",
            fontWeight: "400"
          }}, opt.label)
        );
      })
    );
  }

  function CategoryCard(props) {
    var cat = props.cat, index = props.index, assessment = props.assessment;
    var onWeightChange = props.onWeightChange, onAttributionChange = props.onAttributionChange;
    var dragging = props.dragging;
    var dragHandlers = {
      draggable: true,
      onDragStart: props.onDragStart,
      onDragEnter: props.onDragEnter,
      onDragEnd: props.onDragEnd,
      onDragOver: function(e) { e.preventDefault(); },
      onTouchStart: props.onTouchStart,
      onTouchMove: props.onTouchMove,
      onTouchEnd: props.onTouchEnd
    };

    return h('div', Object.assign({}, dragHandlers, { style: {
      background: C.surface,
      border: "1.5px solid " + (dragging ? C.accent : C.border1),
      borderRadius: "12px",
      overflow: "hidden",
      opacity: dragging ? 0.5 : 1,
      transition: "opacity 0.15s ease, border-color 0.15s ease",
      touchAction: "none",
      boxShadow: "0 1px 4px rgba(0,0,0,0.07)"
    }}),
      h('div', { style: {
        display: "flex", alignItems: "center",
        padding: "14px 16px", gap: "12px",
        borderBottom: "1px solid " + C.border2
      }},
        h('span', { style: { color: C.accent, fontSize: "11px", fontFamily: "'DM Mono', monospace", minWidth: "20px", fontWeight: "400" }},
          String(index + 1).padStart(2, "0")
        ),
        h('div', { style: { flex: "1" } },
          h('div', { style: { color: C.text, fontSize: "16px", fontFamily: "'Playfair Display', serif", letterSpacing: "0.02em", marginBottom: "3px", fontWeight: "400" }},
            cat.label
          ),
          h('div', { style: { color: C.dim2, fontSize: "11px", fontFamily: "'DM Mono', monospace", lineHeight: "1.5", letterSpacing: "0.02em" }},
            cat.description
          )
        ),
        h('div', { style: { color: C.dim3, fontSize: "16px", userSelect: "none", cursor: "grab", padding: "0 2px" }}, "⠿")
      ),
      h('div', { style: { padding: "12px 16px 14px", display: "flex", flexDirection: "column", gap: "8px", background: C.bg }},
        h(Selector, {
          options: WEIGHTS,
          value: assessment.weight || null,
          onChange: function(v) { onWeightChange(cat.id, v); },
          renderIcon: function(opt, active) { return h(BarIcon, { count: opt.bars, active: active }); }
        }),
        h(Selector, {
          options: ATTRIBUTIONS,
          value: assessment.attribution || null,
          onChange: function(v) { onAttributionChange(cat.id, v); },
          renderIcon: function(opt, active) { return h(CircleIcon, { type: opt.value, active: active }); }
        })
      )
    );
  }

  function DraggableList(props) {
    var items = props.items, assessments = props.assessments;
    var onReorder = props.onReorder, onWeightChange = props.onWeightChange, onAttributionChange = props.onAttributionChange;

    var dragItem     = React.useRef(null);
    var dragOverItem = React.useRef(null);
    var touchItem    = React.useRef(null);
    var itemRefs     = React.useRef([]);
    var draggingIndex = React.useState(null);
    var setDraggingIndex = draggingIndex[1];
    draggingIndex = draggingIndex[0];

    function handleDragStart(i) { dragItem.current = i; setDraggingIndex(i); }
    function handleDragEnter(i) { dragOverItem.current = i; }
    function handleDragEnd() {
      if (dragItem.current !== null && dragOverItem.current !== null && dragItem.current !== dragOverItem.current) {
        var next = items.slice();
        var moved = next.splice(dragItem.current, 1)[0];
        next.splice(dragOverItem.current, 0, moved);
        onReorder(next);
      }
      dragItem.current = null; dragOverItem.current = null; setDraggingIndex(null);
    }
    function handleTouchStart(i, e) { touchItem.current = i; }
    function handleTouchMove(i, e) {
      e.preventDefault();
      var y = e.touches[0].clientY;
      itemRefs.current.forEach(function(ref, idx) {
        if (!ref) return;
        var rect = ref.getBoundingClientRect();
        if (y >= rect.top && y <= rect.bottom) dragOverItem.current = idx;
      });
    }
    function handleTouchEnd() {
      if (touchItem.current !== null && dragOverItem.current !== null && touchItem.current !== dragOverItem.current) {
        var next = items.slice();
        var moved = next.splice(touchItem.current, 1)[0];
        next.splice(dragOverItem.current, 0, moved);
        onReorder(next);
      }
      touchItem.current = null; dragOverItem.current = null;
    }

    return h('div', { style: { display: "flex", flexDirection: "column", gap: "8px" } },
      items.map(function(cat, i) {
        return h('div', { key: cat.id, ref: function(el) { itemRefs.current[i] = el; } },
          h(CategoryCard, {
            cat: cat, index: i,
            assessment: assessments[cat.id] || {},
            onWeightChange: onWeightChange,
            onAttributionChange: onAttributionChange,
            dragging: draggingIndex === i,
            onDragStart: function() { handleDragStart(i); },
            onDragEnter: function() { handleDragEnter(i); },
            onDragEnd: handleDragEnd,
            onTouchStart: function(e) { handleTouchStart(i, e); },
            onTouchMove: function(e) { handleTouchMove(i, e); },
            onTouchEnd: handleTouchEnd
          })
        );
      })
    );
  }

  function Legend() {
    return h('div', { style: { display: "flex", flexWrap: "wrap", gap: "10px 16px", justifyContent: "center" } },
      WEIGHTS.map(function(w) {
        return h('div', { key: w.value, style: { display: "flex", alignItems: "center", gap: "7px" } },
          h(BarIcon, { count: w.bars, active: true }),
          h('span', { style: { color: C.dim1, fontSize: "10px", fontFamily: "'DM Mono', monospace", letterSpacing: "0.07em" }}, w.label)
        );
      }).concat([
        h('div', { key: "divider", style: { width: "1px", background: C.border1, alignSelf: "stretch" } })
      ]).concat(
        ATTRIBUTIONS.map(function(a) {
          return h('div', { key: a.value, style: { display: "flex", alignItems: "center", gap: "7px" } },
            h(CircleIcon, { type: a.value, active: true }),
            h('span', { style: { color: C.dim1, fontSize: "10px", fontFamily: "'DM Mono', monospace", letterSpacing: "0.07em", whiteSpace: "nowrap" }}, a.label)
          );
        })
      )
    );
  }

  function IntroScreen(props) {
    return h('div', { style: {
      minHeight: "100vh", background: C.bg,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      padding: "40px 24px"
    }},
      h('div', { style: { maxWidth: "340px", width: "100%", textAlign: "center" } },
        h('div', { style: { fontSize: "11px", letterSpacing: "0.3em", color: C.dim3, fontFamily: "'DM Mono', monospace", marginBottom: "20px" }}, "◆"),
        h('h1', { style: { fontSize: "56px", fontFamily: "'Playfair Display', serif", color: C.text, letterSpacing: "0.04em", marginBottom: "14px", fontWeight: "400" }},
          "Baseline"
        ),
        h('p', { style: { color: C.dim1, fontSize: "13px", fontFamily: "'DM Mono', monospace", lineHeight: "2.2", letterSpacing: "0.06em", marginBottom: "40px" }},
          "Eleven categories.", h('br'), "Three inputs each.", h('br'), "One honest conversation."
        ),
        h('div', { style: {
          display: "flex", flexDirection: "column", gap: "14px",
          marginBottom: "40px", textAlign: "left",
          padding: "22px", background: C.surface,
          border: "1px solid " + C.border1, borderRadius: "12px",
          boxShadow: "0 1px 4px rgba(0,0,0,0.07)"
        }},
          [
            "Rank categories by dragging them into your order of importance.",
            "For each category, select a weight and an attribution.",
            "Complete privately. Share your screen when ready."
          ].map(function(step, i) {
            return h('div', { key: i, style: { display: "flex", gap: "14px", alignItems: "flex-start" } },
              h('span', { style: { color: C.accent, fontFamily: "'DM Mono', monospace", fontSize: "11px", minWidth: "20px", paddingTop: "1px" }},
                String(i+1).padStart(2,"0")
              ),
              h('span', { style: { color: C.dim1, fontFamily: "'DM Mono', monospace", fontSize: "12px", lineHeight: "1.7", letterSpacing: "0.03em" }},
                step
              )
            );
          })
        ),
        h('button', {
          onClick: props.onBegin,
          style: {
            width: "100%", padding: "18px",
            background: C.accent, border: "none", borderRadius: "10px",
            color: "#fff", fontSize: "11px", fontFamily: "'DM Mono', monospace",
            letterSpacing: "0.2em", textTransform: "uppercase", cursor: "pointer",
            boxShadow: "0 2px 10px rgba(184,92,56,0.35)"
          }
        }, "Begin")
      )
    );
  }

  function AssessmentScreen(props) {
    var items = props.items, assessments = props.assessments;
    var completed  = items.filter(function(cat) { return assessments[cat.id] && assessments[cat.id].weight && assessments[cat.id].attribution; }).length;
    var isComplete = completed === items.length;

    return h('div', { style: { minHeight: "100vh", background: C.bg } },
      h('div', { style: { maxWidth: "480px", margin: "0 auto", padding: "0 14px 130px" } },
        h('div', { style: {
          padding: "20px 0 16px",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          borderBottom: "1px solid " + C.border1, marginBottom: "16px",
          position: "sticky", top: "0", background: C.bg, zIndex: "10"
        }},
          h('span', { style: { fontSize: "18px", fontFamily: "'Playfair Display', serif", color: C.text, letterSpacing: "0.04em" }}, "Baseline"),
          h('span', { style: { fontSize: "11px", fontFamily: "'DM Mono', monospace", color: isComplete ? C.accent : C.dim3, letterSpacing: "0.1em", transition: "color 0.3s" }},
            completed + " / " + items.length
          )
        ),
        h('div', { style: { fontSize: "10px", color: C.dim3, fontFamily: "'DM Mono', monospace", letterSpacing: "0.1em", marginBottom: "14px" }},
          "DRAG TO RANK · TAP TO SELECT"
        ),
        h(DraggableList, {
          items: items, assessments: assessments,
          onReorder: props.onReorder,
          onWeightChange: props.onWeightChange,
          onAttributionChange: props.onAttributionChange
        })
      ),
      h('div', { style: {
        position: "fixed", bottom: "0", left: "0", right: "0",
        padding: "16px 20px 28px",
        background: "linear-gradient(to top, " + C.bg + " 65%, transparent)",
        display: "flex", justifyContent: "center"
      }},
        h('button', {
          onClick: function() { if (isComplete) props.onViewResults(); },
          style: {
            width: "100%", maxWidth: "480px", padding: "17px",
            background: isComplete ? C.accent : "transparent",
            border: "1.5px solid " + (isComplete ? C.accent : C.border1),
            borderRadius: "10px",
            color: isComplete ? "#fff" : C.dim2,
            fontSize: "11px", fontFamily: "'DM Mono', monospace",
            letterSpacing: "0.18em", textTransform: "uppercase",
            cursor: isComplete ? "pointer" : "default",
            transition: "all 0.3s ease",
            boxShadow: isComplete ? "0 2px 10px rgba(184,92,56,0.35)" : "none"
          }
        }, isComplete ? "View Results" : (items.length - completed) + " categories remaining")
      )
    );
  }

  function ResultsScreen(props) {
    var items = props.items, assessments = props.assessments;
    return h('div', { style: { minHeight: "100vh", background: C.bg } },
      h('div', { style: { maxWidth: "480px", margin: "0 auto", padding: "0 14px 48px" } },
        h('div', { style: { padding: "32px 0 24px", textAlign: "center" } },
          h('div', { style: { fontSize: "10px", letterSpacing: "0.25em", color: C.accent, fontFamily: "'DM Mono', monospace", marginBottom: "10px" }}, "◆"),
          h('h2', { style: { fontSize: "30px", fontFamily: "'Playfair Display', serif", color: C.text, fontWeight: "400", marginBottom: "8px" }}, "Your Baseline"),
          h('p', { style: { fontSize: "12px", color: C.dim1, fontFamily: "'DM Mono', monospace", letterSpacing: "0.07em" }}, "Share this screen with your partner")
        ),
        h('div', { style: { display: "flex", flexDirection: "column", gap: "5px", marginBottom: "28px" } },
          items.map(function(cat, i) {
            var a_data = assessments[cat.id] || {};
            var w = WEIGHTS.find(function(x) { return x.value === a_data.weight; });
            var a = ATTRIBUTIONS.find(function(x) { return x.value === a_data.attribution; });
            return h('div', { key: cat.id, style: {
              display: "flex", alignItems: "center",
              padding: "13px 16px", gap: "12px",
              background: C.surface, border: "1px solid " + C.border1, borderRadius: "8px",
              boxShadow: "0 1px 3px rgba(0,0,0,0.05)"
            }},
              h('span', { style: { color: C.accent, fontSize: "11px", fontFamily: "'DM Mono', monospace", minWidth: "20px" }},
                String(i+1).padStart(2,"0")
              ),
              h('span', { style: { flex: "1", color: C.text, fontSize: "16px", fontFamily: "'Playfair Display', serif" }},
                cat.label
              ),
              h('div', { style: { display: "flex", alignItems: "center", gap: "14px" } },
                w ? h(BarIcon, { count: w.bars, active: true }) : null,
                a ? h(CircleIcon, { type: a.value, active: true }) : null
              )
            );
          })
        ),
        h('div', { style: {
          padding: "18px", background: C.accentBg,
          border: "1px solid " + C.border1, borderRadius: "10px",
          marginBottom: "22px", textAlign: "center"
        }},
          h('p', { style: { color: C.dim1, fontSize: "11px", fontFamily: "'DM Mono', monospace", lineHeight: "1.9", letterSpacing: "0.04em" }},
            "Want to explore your results together?", h('br'), "Screenshot this screen and share it with Claude."
          )
        ),
        h('div', { style: { marginBottom: "24px" } }, h(Legend)),
        h('button', {
          onClick: props.onReset,
          style: {
            width: "100%", padding: "15px",
            background: "transparent", border: "1.5px solid " + C.border1,
            borderRadius: "10px", color: C.dim1,
            fontSize: "11px", fontFamily: "'DM Mono', monospace",
            letterSpacing: "0.15em", textTransform: "uppercase", cursor: "pointer"
          }
        }, "Start Over")
      )
    );
  }

  function App() {
    var screenState      = React.useState("intro");
    var screen           = screenState[0], setScreen = screenState[1];
    var itemsState       = React.useState(CATEGORIES);
    var items            = itemsState[0], setItems = itemsState[1];
    var assessmentsState = React.useState({});
    var assessments      = assessmentsState[0], setAssessments = assessmentsState[1];

    function handleWeightChange(id, v) {
      setAssessments(function(prev) {
        var next = Object.assign({}, prev);
        next[id] = Object.assign({}, prev[id] || {}, { weight: v });
        return next;
      });
    }
    function handleAttributionChange(id, v) {
      setAssessments(function(prev) {
        var next = Object.assign({}, prev);
        next[id] = Object.assign({}, prev[id] || {}, { attribution: v });
        return next;
      });
    }
    function handleReset() { setItems(CATEGORIES); setAssessments({}); setScreen("intro"); }

    if (screen === "intro")   return h(IntroScreen, { onBegin: function() { setScreen("assessment"); } });
    if (screen === "results") return h(ResultsScreen, { items: items, assessments: assessments, onReset: handleReset });
    return h(AssessmentScreen, {
      items: items, assessments: assessments,
      onReorder: setItems,
      onWeightChange: handleWeightChange,
      onAttributionChange: handleAttributionChange,
      onViewResults: function() { setScreen("results"); }
    });
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
})();
</script>
</body>
</html>
